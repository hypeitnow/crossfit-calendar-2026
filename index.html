<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CrossFit Calendar 2026</title>
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131c;
    --surface2: #1c1c28;
    --surface3: #252535;
    --border: #2a2a3d;
    --accent: #e63946;
    --accent-dim: rgba(230,57,70,0.15);
    --blue: #4a90e2;
    --blue-dim: rgba(74,144,226,0.12);
    --green: #2ecc71;
    --green-dim: rgba(46,204,113,0.12);
    --orange: #f39c12;
    --orange-dim: rgba(243,156,18,0.12);
    --gray: #7f8c8d;
    --gray-dim: rgba(127,140,141,0.12);
    --purple: #9b59b6;
    --purple-dim: rgba(155,89,182,0.12);
    --teal: #1abc9c;
    --teal-dim: rgba(26,188,156,0.12);
    --text: #e8e8f0;
    --text-muted: #7878a0;
    --text-dim: #4a4a6a;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --header-h: 72px;
    --nav-h: 64px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh; min-height: 100dvh;
    overscroll-behavior: none;
  }
  a { color: inherit; text-decoration: none; }

  /* ── STICKY HEADER ── */
  #app-header {
    position: sticky; top: 0; z-index: 50;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0 1rem; height: var(--header-h);
    backdrop-filter: blur(12px);
  }
  .header-logo {
    font-size: 1.1rem; font-weight: 900; letter-spacing: 1px; white-space: nowrap;
  }
  .header-logo span { color: var(--accent); }
  .header-search {
    flex: 1; position: relative;
  }
  .header-search input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 24px; padding: 0.55rem 1rem 0.55rem 2.4rem;
    font-size: 0.9rem; outline: none; transition: border-color 0.2s;
  }
  .header-search input::placeholder { color: var(--text-muted); }
  .header-search input:focus { border-color: var(--accent); }
  .header-search .search-icon {
    position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); font-size: 0.9rem; pointer-events: none;
  }
  .header-search .search-clear {
    position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--text-muted); cursor: pointer;
    font-size: 1rem; display: none; padding: 0;
  }
  .header-search.has-value .search-clear { display: block; }
  .header-today-btn {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text-muted); border-radius: var(--radius-sm);
    padding: 0.5rem 0.75rem; font-size: 0.8rem; cursor: pointer;
    white-space: nowrap; transition: all 0.2s;
  }
  .header-today-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ── LAYOUT ── */
  #main-layout {
    display: flex; gap: 0; max-width: 1400px; margin: 0 auto;
    min-height: calc(100dvh - var(--header-h));
  }

  /* ── SIDEBAR (desktop) ── */
  #sidebar {
    width: 220px; flex-shrink: 0;
    position: sticky; top: var(--header-h);
    height: calc(100dvh - var(--header-h));
    overflow-y: auto; padding: 1.5rem 0.75rem;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 1.5rem;
  }
  #sidebar::-webkit-scrollbar { width: 4px; }
  #sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .sidebar-section h3 {
    font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px;
    color: var(--text-dim); padding: 0 0.5rem; margin-bottom: 0.5rem;
  }
  .filter-btn {
    display: flex; align-items: center; gap: 0.6rem;
    width: 100%; padding: 0.6rem 0.75rem; border-radius: var(--radius-sm);
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 0.88rem; text-align: left;
    transition: all 0.18s; position: relative;
  }
  .filter-btn:hover { background: var(--surface2); color: var(--text); }
  .filter-btn.active { background: var(--surface2); color: var(--text); font-weight: 600; }
  .filter-btn.active::before {
    content: ''; position: absolute; left: 0; top: 20%; bottom: 20%;
    width: 3px; border-radius: 2px; background: var(--accent);
  }
  .filter-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .filter-count {
    margin-left: auto; font-size: 0.75rem; background: var(--surface3);
    padding: 0.1rem 0.5rem; border-radius: 10px; color: var(--text-dim);
  }
  .filter-btn.active .filter-count { color: var(--text-muted); }

  .month-nav-list { display: flex; flex-direction: column; gap: 2px; }
  .month-nav-btn {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 0.45rem 0.75rem; border-radius: var(--radius-sm);
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 0.82rem; transition: all 0.15s;
  }
  .month-nav-btn:hover { background: var(--surface2); color: var(--text); }
  .month-nav-btn.has-events { color: var(--text); }
  .month-nav-count { font-size: 0.7rem; color: var(--text-dim); }

  /* ── MAIN CONTENT ── */
  #content {
    flex: 1; min-width: 0; padding: 1.5rem 1.5rem 8rem;
    overflow-y: auto;
  }

  /* ── NEXT EVENT BANNER ── */
  #next-event-banner {
    background: linear-gradient(135deg, var(--surface2) 0%, rgba(230,57,70,0.08) 100%);
    border: 1px solid rgba(230,57,70,0.25); border-radius: var(--radius);
    padding: 1rem 1.25rem; margin-bottom: 1.5rem;
    display: flex; align-items: center; gap: 1rem; cursor: pointer;
    transition: all 0.2s;
  }
  #next-event-banner:hover { border-color: rgba(230,57,70,0.5); }
  .banner-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); margin-bottom: 0.25rem; }
  .banner-name { font-size: 1rem; font-weight: 700; }
  .banner-sub { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.2rem; }
  .banner-countdown {
    margin-left: auto; text-align: center; flex-shrink: 0;
    background: var(--accent-dim); border: 1px solid rgba(230,57,70,0.3);
    border-radius: var(--radius-sm); padding: 0.5rem 0.9rem;
  }
  .banner-days { font-size: 1.6rem; font-weight: 900; color: var(--accent); line-height: 1; }
  .banner-days-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
  .banner-icon { font-size: 1.8rem; flex-shrink: 0; }

  /* ── MONTH SECTION ── */
  .month-section { margin-bottom: 2.5rem; scroll-margin-top: calc(var(--header-h) + 16px); }
  .month-header {
    display: flex; align-items: center; gap: 0.75rem;
    margin-bottom: 1rem; position: sticky;
    top: var(--header-h); z-index: 10;
    background: var(--bg); padding: 0.5rem 0;
  }
  .month-name-badge {
    font-size: 0.75rem; font-weight: 800; text-transform: uppercase;
    letter-spacing: 3px; color: var(--text-muted);
    background: var(--surface2); border: 1px solid var(--border);
    padding: 0.35rem 0.85rem; border-radius: 20px;
    white-space: nowrap;
  }
  .month-line { flex: 1; height: 1px; background: var(--border); }
  .month-event-count { font-size: 0.75rem; color: var(--text-dim); }

  /* ── EVENT CARDS ── */
  .events-list { display: flex; flex-direction: column; gap: 0.6rem; }

  .event-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 0.9rem 1rem 0.9rem 1.25rem;
    display: grid; grid-template-columns: 70px 1fr auto;
    align-items: center; gap: 0.75rem;
    cursor: pointer; transition: transform 0.15s, border-color 0.15s, background 0.15s;
    border-left: 3px solid var(--gray);
    position: relative; overflow: hidden;
  }
  .event-card::before {
    content: ''; position: absolute; inset: 0; opacity: 0;
    transition: opacity 0.2s;
  }
  .event-card:hover { transform: translateX(2px); border-color: var(--surface3); background: var(--surface2); }
  .event-card:active { transform: scale(0.99); }
  .event-card.upcoming { border-color: rgba(230,57,70,0.3); }
  .event-card.today { animation: pulse-border 2s infinite; }

  .event-card[data-type="qualifier"] { border-left-color: var(--blue); }
  .event-card[data-type="qualifier"]::before { background: var(--blue-dim); }
  .event-card[data-type="final"] { border-left-color: var(--accent); }
  .event-card[data-type="final"]::before { background: var(--accent-dim); }
  .event-card[data-type="local"] { border-left-color: var(--green); }
  .event-card[data-type="local"]::before { background: var(--green-dim); }
  .event-card[data-type="eu"] { border-left-color: var(--teal); }
  .event-card[data-type="eu"]::before { background: var(--teal-dim); }
  .event-card[data-type="global"] { border-left-color: var(--purple); }
  .event-card[data-type="global"]::before { background: var(--purple-dim); }
  .event-card[data-type="semifinal"] { border-left-color: var(--orange); }
  .event-card[data-type="semifinal"]::before { background: var(--orange-dim); }
  .event-card[data-type="tba"] { border-left-color: var(--gray); opacity: 0.65; }
  .event-card:hover::before { opacity: 1; }

  @keyframes pulse-border {
    0%, 100% { box-shadow: 0 0 0 0 rgba(230,57,70,0.3); }
    50% { box-shadow: 0 0 0 4px rgba(230,57,70,0.1); }
  }

  /* Date block */
  .event-date { text-align: center; }
  .event-date .ed-day {
    font-size: 1.5rem; font-weight: 800; line-height: 1; color: var(--text);
    font-variant-numeric: tabular-nums;
  }
  .event-date .ed-month {
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px;
    color: var(--text-muted); margin-top: 1px;
  }
  .event-date .ed-tba {
    font-size: 0.75rem; font-weight: 700; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 1px;
  }
  .event-date .ed-range {
    font-size: 0.72rem; color: var(--text-muted); margin-top: 1px;
    line-height: 1.3;
  }

  /* Event info */
  .event-info { min-width: 0; }
  .event-name {
    font-size: 0.95rem; font-weight: 600; margin-bottom: 0.3rem;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .event-meta {
    display: flex; flex-wrap: wrap; gap: 0.3rem; align-items: center;
  }
  .event-location-inline {
    font-size: 0.75rem; color: var(--text-muted);
    display: flex; align-items: center; gap: 0.25rem;
  }
  .event-duration {
    font-size: 0.7rem; color: var(--text-dim);
    background: var(--surface3); border-radius: 10px;
    padding: 0.1rem 0.45rem;
  }

  /* Type badge */
  .type-badge {
    font-size: 0.65rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.5px; padding: 0.25rem 0.6rem; border-radius: 20px;
    white-space: nowrap; border: 1px solid transparent; flex-shrink: 0;
  }
  .tb-global { background: var(--purple-dim); color: var(--purple); border-color: rgba(155,89,182,0.3); }
  .tb-semifinal { background: var(--orange-dim); color: var(--orange); border-color: rgba(243,156,18,0.3); }
  .tb-qualifier { background: var(--blue-dim); color: var(--blue); border-color: rgba(74,144,226,0.3); }
  .tb-final { background: var(--accent-dim); color: var(--accent); border-color: rgba(230,57,70,0.3); }
  .tb-local { background: var(--green-dim); color: var(--green); border-color: rgba(46,204,113,0.3); }
  .tb-eu { background: var(--teal-dim); color: var(--teal); border-color: rgba(26,188,156,0.3); }
  .tb-tba { background: var(--gray-dim); color: var(--gray); border-color: rgba(127,140,141,0.3); }

  /* Category pills */
  .cat-pill {
    font-size: 0.65rem; padding: 0.1rem 0.45rem; border-radius: 20px; font-weight: 600;
  }
  .cp-rx { background: rgba(243,156,18,0.15); color: #f39c12; }
  .cp-scaled { background: rgba(52,152,219,0.15); color: #3498db; }
  .cp-intermediate { background: rgba(26,188,156,0.15); color: #1abc9c; }
  .cp-masters { background: rgba(230,126,34,0.15); color: #e67e22; }
  .cp-teams { background: rgba(100,100,130,0.3); color: #bdc3c7; }
  .cp-open { background: rgba(149,165,166,0.15); color: #95a5a6; }
  .cp-amator { background: rgba(46,204,113,0.12); color: #2ecc71; }
  .cp-licensed { background: rgba(26,188,156,0.1); color: #1abc9c; }

  /* Today chip */
  .today-chip {
    font-size: 0.6rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
    background: var(--accent); color: #fff; padding: 0.1rem 0.4rem; border-radius: 4px;
    animation: blink 1.5s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.6;} }

  /* ── MODAL ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.75); backdrop-filter: blur(4px);
    align-items: flex-end; justify-content: center;
    padding: 0;
  }
  .modal-overlay.open { display: flex; }
  .modal-sheet {
    background: var(--surface); width: 100%; max-width: 600px;
    border-radius: 20px 20px 0 0; padding: 0 1.5rem 2rem;
    max-height: 90dvh; overflow-y: auto;
    animation: slideUp 0.25s cubic-bezier(0.34,1.56,0.64,1);
    position: relative;
  }
  .modal-sheet::-webkit-scrollbar { width: 4px; }
  .modal-sheet::-webkit-scrollbar-thumb { background: var(--border); }
  @keyframes slideUp {
    from { transform: translateY(100%); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-handle {
    width: 36px; height: 4px; background: var(--border);
    border-radius: 2px; margin: 0.75rem auto 1.25rem;
  }
  .modal-type-row {
    display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem;
  }
  .modal-color-bar {
    width: 4px; height: 40px; border-radius: 2px; flex-shrink: 0;
  }
  .modal-title { font-size: 1.25rem; font-weight: 800; line-height: 1.2; }
  .modal-subtitle { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem; }
  .modal-divider { height: 1px; background: var(--border); margin: 1.25rem 0; }
  .modal-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem;
  }
  .modal-info-box {
    background: var(--surface2); border-radius: var(--radius-sm);
    padding: 0.75rem; border: 1px solid var(--border);
  }
  .mib-label {
    font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px;
    color: var(--text-dim); margin-bottom: 0.3rem;
  }
  .mib-value { font-size: 0.9rem; font-weight: 600; }
  .mib-value.accent { color: var(--accent); }
  .modal-notes {
    background: var(--surface2); border-radius: var(--radius-sm);
    padding: 0.75rem 1rem; border: 1px solid var(--border);
    font-size: 0.88rem; color: var(--text-muted); line-height: 1.6;
    margin-top: 0.75rem;
  }
  .modal-cats {
    display: flex; flex-wrap: wrap; gap: 0.4rem; margin-top: 0.75rem;
  }
  .modal-close-btn {
    position: absolute; top: 1rem; right: 1rem;
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text-muted); cursor: pointer;
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; transition: all 0.15s;
  }
  .modal-close-btn:hover { background: var(--surface3); color: var(--text); }
  .modal-countdown-full {
    text-align: center; padding: 1rem;
    background: var(--surface2); border-radius: var(--radius-sm);
    border: 1px solid var(--border); margin-top: 0.75rem;
  }
  .mcf-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 0.25rem; }
  .mcf-value { font-size: 2rem; font-weight: 900; color: var(--accent); }
  .mcf-sub { font-size: 0.75rem; color: var(--text-muted); }

  /* ── BOTTOM NAV (mobile only) ── */
  #bottom-nav {
    display: none; position: fixed; bottom: 0; left: 0; right: 0;
    z-index: 100; background: var(--surface);
    border-top: 1px solid var(--border);
    height: var(--nav-h);
    padding: 0 0.5rem;
    padding-bottom: env(safe-area-inset-bottom, 0);
    display: grid;
    grid-template-columns: repeat(5, 1fr);
  }
  .bnav-btn {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; background: none; border: none; color: var(--text-dim);
    cursor: pointer; font-size: 0.6rem; text-transform: uppercase;
    letter-spacing: 0.5px; transition: color 0.15s; padding: 0.5rem 0;
  }
  .bnav-btn .bnav-icon { font-size: 1.25rem; }
  .bnav-btn.active { color: var(--accent); }
  .bnav-btn.active .bnav-icon { filter: drop-shadow(0 0 6px var(--accent)); }

  /* ── STATS ROW ── */
  #stats-row {
    display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1.5rem;
  }
  .stat-chip {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 0.35rem 0.75rem;
    font-size: 0.78rem; color: var(--text-muted);
    display: flex; align-items: center; gap: 0.4rem;
  }
  .stat-chip b { color: var(--text); }
  .stat-chip .sc-dot { width: 7px; height: 7px; border-radius: 50%; }

  /* ── EMPTY STATE ── */
  .empty-state {
    text-align: center; padding: 4rem 2rem; color: var(--text-muted);
  }
  .empty-state .es-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.5; }
  .empty-state h3 { font-size: 1.1rem; margin-bottom: 0.5rem; color: var(--text); }

  /* ── RESPONSIVE ── */
  @media (max-width: 900px) {
    #sidebar { display: none; }
    #content { padding: 1rem 1rem 5rem; }
  }
  @media (max-width: 600px) {
    #bottom-nav { display: grid; }
    #content { padding-bottom: calc(var(--nav-h) + 1rem + env(safe-area-inset-bottom,0)); }
    .header-logo { display: none; }
    .event-card { grid-template-columns: 60px 1fr; }
    .type-badge { display: none; }
    .event-name { white-space: normal; }
    .modal-grid { grid-template-columns: 1fr; }
    .banner-icon { display: none; }
  }
  @media (min-width: 601px) {
    #bottom-nav { display: none !important; }
  }
  @media (min-width: 900px) {
    #sidebar { display: flex; }
  }
  @media (min-width: 1200px) {
    #content { padding: 2rem 2rem 3rem; }
  }
</style>
</head>
<body>

<header id="app-header">
  <div class="header-logo">CROSSFIT <span>2026</span></div>
  <div class="header-search" id="search-wrapper">
    <span class="search-icon">🔍</span>
    <input type="search" id="search-input" placeholder="Szukaj zawodów..." autocomplete="off" />
    <button class="search-clear" id="search-clear" aria-label="Wyczyść">✕</button>
  </div>
  <button class="header-today-btn" id="today-btn">📅 Dziś</button>
</header>

<div id="main-layout">
  <aside id="sidebar">
    <div class="sidebar-section">
      <h3>Filtruj</h3>
      <button class="filter-btn active" data-filter="all">
        <span class="filter-dot" style="background:#888"></span>
        Wszystkie
        <span class="filter-count" id="cnt-all">—</span>
      </button>
      <button class="filter-btn" data-filter="global">
        <span class="filter-dot" style="background:#9b59b6"></span>
        CrossFit HQ
        <span class="filter-count" id="cnt-global">—</span>
      </button>
      <button class="filter-btn" data-filter="semifinal">
        <span class="filter-dot" style="background:#f39c12"></span>
        Semifinals
        <span class="filter-count" id="cnt-semifinal">—</span>
      </button>
      <button class="filter-btn" data-filter="qualifier">
        <span class="filter-dot" style="background:#4a90e2"></span>
        Kwalifikacje
        <span class="filter-count" id="cnt-qualifier">—</span>
      </button>
      <button class="filter-btn" data-filter="final">
        <span class="filter-dot" style="background:#e63946"></span>
        Finały
        <span class="filter-count" id="cnt-final">—</span>
      </button>
      <button class="filter-btn" data-filter="local">
        <span class="filter-dot" style="background:#2ecc71"></span>
        🇵🇱 Polska
        <span class="filter-count" id="cnt-local">—</span>
      </button>
      <button class="filter-btn" data-filter="eu">
        <span class="filter-dot" style="background:#1abc9c"></span>
        🇪🇺 Europa Licensed
        <span class="filter-count" id="cnt-eu">—</span>
      </button>
      <button class="filter-btn" data-filter="tba">
        <span class="filter-dot" style="background:#7f8c8d"></span>
        Data TBA

  global:"🏆", semifinal:"⚡", qualifier:"🎯", final:"🥇", local:"🇵🇱", eu:"🇪🇺", tba:"❓"
};

let activeFilter = "all";
let searchQuery = "";

// ── Helpers ──────────────────────────────────────────────────────────────────
function parseDate(str) {
  if (!str) return null;
  const d = new Date(str + "T00:00:00"); d.setHours(0,0,0,0); return d;
}
function diffDays(d1, d2) { return Math.round((d2 - d1) / 86400000); }
function durationDays(ev) {
  if (!ev.start || !ev.end) return 1;
  return diffDays(parseDate(ev.start), parseDate(ev.end)) + 1;
}
function isOngoing(ev) {
  if (!ev.start) return false;
  const s = parseDate(ev.start), e = parseDate(ev.end || ev.start);
  return TODAY >= s && TODAY <= e;
}
function isFuture(ev) {
  if (!ev.start) return false;
  return parseDate(ev.start) > TODAY;
}
function isPast(ev) {
  if (!ev.start) return false;
  return parseDate(ev.end || ev.start) < TODAY;
}
function getCountdown(ev) {
  if (!ev.start) return null;
  const s = parseDate(ev.start);
  if (s > TODAY) return diffDays(TODAY, s);
  return null;
}
function formatDateRange(ev) {
  if (!ev.start) return "TBA";
  const s = parseDate(ev.start);
  const label = d => d.toLocaleDateString("pl-PL", {day:"2-digit",month:"2-digit"});
  if (!ev.end || ev.start === ev.end) return label(s);
  return label(s) + " – " + label(parseDate(ev.end));
}
function formatDateFull(ev) {
  if (!ev.start) return "Data do ogłoszenia";
  const s = parseDate(ev.start);
  const opts = { day:"numeric", month:"long", year:"numeric" };
  if (!ev.end || ev.start === ev.end) return s.toLocaleDateString("pl-PL", opts);
  const e = parseDate(ev.end);
  if (s.getMonth() === e.getMonth()) {
    return `${s.getDate()}–${e.getDate()} ${s.toLocaleDateString("pl-PL",{month:"long"})} ${s.getFullYear()}`;
  }
  return `${s.toLocaleDateString("pl-PL",{day:"numeric",month:"long"})} – ${e.toLocaleDateString("pl-PL",{day:"numeric",month:"long",year:"numeric"})}`;
}

function getEventMonth(ev) {
  if (!ev.start) return null;
  return parseInt(ev.start.split("-")[1]) - 1; // 0-indexed
}

function catPillHTML(c) {
  const cls = "cp-" + c.toLowerCase().replace(/[^a-z]/g,"");
  return `<span class="cat-pill ${cls}">${c}</span>`;
}

// ── Filter & Search ───────────────────────────────────────────────────────────
function getFiltered() {
  let evs = EVENTS;
  if (activeFilter !== "all") evs = evs.filter(e => e.type === activeFilter);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    evs = evs.filter(e =>
      e.name.toLowerCase().includes(q) ||
      (e.location && e.location.toLowerCase().includes(q)) ||
      (e.notes && e.notes.toLowerCase().includes(q))
    );
  }
  return evs;
}

// ── Render date block ─────────────────────────────────────────────────────────
function renderDateBlock(ev) {
  if (!ev.start) return `<div class="event-date"><div class="ed-tba">TBA</div></div>`;
  const s = parseDate(ev.start);
  const day = String(s.getDate()).padStart(2,"0");
  const mon = MONTHS_PL_SHORT[s.getMonth()];
  if (ev.end && ev.start !== ev.end) {
    const e = parseDate(ev.end);
    const eDay = String(e.getDate()).padStart(2,"0");
    const eMon = MONTHS_PL_SHORT[e.getMonth()];
    const rangeStr = s.getMonth() === e.getMonth()
      ? `${day}–${eDay} ${mon}` : `${day} ${mon}–${eDay} ${eMon}`;
    return `<div class="event-date"><div class="ed-range">${rangeStr}</div></div>`;
  }
  return `<div class="event-date"><div class="ed-day">${day}</div><div class="ed-month">${mon}</div></div>`;
}

// ── Build card ────────────────────────────────────────────────────────────────
function buildCard(ev, idx) {
  const tm = TYPE_META[ev.type];
  const dur = durationDays(ev);
  const ongoing = isOngoing(ev);
  const past = isPast(ev);
  let extraClass = "";
  if (ongoing) extraClass = "today";
  else if (!past && ev.start) extraClass = "upcoming";

  const durText = dur > 1 ? `${dur} dni` : "1 dzień";
  const durHTML = `<span class="event-duration">${durText}</span>`;

  const locationHTML = ev.location
    ? `<span class="event-location-inline">📍 ${ev.location}</span>` : "";

  const todayChip = ongoing ? `<span class="today-chip">TRWA</span>` : "";
  const cats = ev.categories.map(catPillHTML).join("");

  return `
    <div class="event-card ${extraClass}" data-type="${ev.type}" data-idx="${idx}" role="button" tabindex="0" aria-label="${ev.name}">
      ${renderDateBlock(ev)}
      <div class="event-info">
        <div class="event-name">${ev.name}</div>
        <div class="event-meta">
          ${todayChip}
          ${locationHTML}
          ${ev.start ? durHTML : ""}
          ${cats}
        </div>
      </div>
      <span class="type-badge ${tm.badgeClass}">${TYPE_ICONS[ev.type]} ${tm.label}</span>
    </div>`;
}

// ── Update stats ──────────────────────────────────────────────────────────────
function updateStats(filtered) {
  const counts = {};
  filtered.forEach(e => { counts[e.type] = (counts[e.type]||0)+1; });
  const total = filtered.length;

  // Update sidebar counts
  document.getElementById("cnt-all").textContent = EVENTS.length;
  Object.keys(TYPE_META).forEach(t => {
    const el = document.getElementById("cnt-"+t);
    if (el) el.textContent = EVENTS.filter(e=>e.type===t).length;
  });

  // Stats row
  const order = ["global","semifinal","qualifier","final","local","eu","tba"];
  let html = `<div class="stat-chip"><b>${total}</b> wydarzeń</div>`;
  order.forEach(t => {
    if (!counts[t]) return;
    html += `<div class="stat-chip"><span class="sc-dot" style="background:${TYPE_META[t].color}"></span>${TYPE_META[t].label}: <b>${counts[t]}</b></div>`;
  });
  document.getElementById("stats-row").innerHTML = html;
}

// ── Next event banner ─────────────────────────────────────────────────────────
function renderBanner() {
  const banner = document.getElementById("next-event-banner");
  // Find soonest upcoming or ongoing
  const candidates = EVENTS.filter(e => e.start && (isFuture(e) || isOngoing(e)));
  if (!candidates.length) { banner.style.display = "none"; return; }
  candidates.sort((a,b) => a.start.localeCompare(b.start));
  const ev = candidates[0];
  const idx = EVENTS.indexOf(ev);
  const tm = TYPE_META[ev.type];
  const ongoing = isOngoing(ev);
  const countdown = ongoing ? 0 : getCountdown(ev);
  const label = ongoing ? "🔴 TRWA TERAZ" : "NASTĘPNE ZAWODY";

  banner.style.display = "flex";
  banner.innerHTML = `
    <span class="banner-icon">${TYPE_ICONS[ev.type]}</span>
    <div style="flex:1;min-width:0">
      <div class="banner-label">${label}</div>
      <div class="banner-name">${ev.name}</div>
      <div class="banner-sub">📍 ${ev.location || "—"} · ${formatDateFull(ev)}</div>
    </div>
    <div class="banner-countdown">
      <div class="banner-days">${ongoing ? "▶" : countdown}</div>
      <div class="banner-days-label">${ongoing ? "w toku" : countdown === 1 ? "dzień" : "dni"}</div>
    </div>`;
  banner.dataset.idx = idx;
  banner.onclick = () => openModal(idx);
}

// ── Month nav ─────────────────────────────────────────────────────────────────
function renderMonthNav() {
  const nav = document.getElementById("month-nav");
  let html = "";
  MONTHS_PL.forEach((m, mi) => {
    const count = EVENTS.filter(e => getEventMonth(e) === mi).length;
    const hasClass = count > 0 ? "has-events" : "";
    html += `<button class="month-nav-btn ${hasClass}" data-month="${mi}" ${count===0?"disabled":""}>
      ${m} <span class="month-nav-count">${count || ""}</span>
    </button>`;
  });
  nav.innerHTML = html;
  nav.querySelectorAll("button[data-month]").forEach(btn => {
    btn.addEventListener("click", () => {
      const el = document.getElementById("month-" + btn.dataset.month);
      if (el) el.scrollIntoView({ behavior: "smooth" });
    });
  });
}

// ── Render calendar ───────────────────────────────────────────────────────────
function render() {
  const filtered = getFiltered();
  updateStats(filtered);
  renderBanner();

  const tbas = filtered.filter(e => !e.start);
  const dated = filtered.filter(e => e.start);

  const main = document.getElementById("calendar-main");
  let html = "";

  MONTHS_PL.forEach((m, mi) => {
    const monthEvs = dated.filter(e => getEventMonth(e) === mi);
    if (!monthEvs.length) return;
    monthEvs.sort((a,b) => a.start.localeCompare(b.start));
    const ids = monthEvs.map(ev => EVENTS.indexOf(ev));
    html += `<section class="month-section" id="month-${mi}">
      <div class="month-header">
        <div class="month-name-badge">${m} 2026</div>
        <div class="month-line"></div>
        <div class="month-event-count">${monthEvs.length} event${monthEvs.length===1?"":"ów"}</div>
      </div>
      <div class="events-list">
        ${monthEvs.map((ev,i) => buildCard(ev, ids[i])).join("")}
      </div>
    </section>`;
  });

  if (tbas.length) {
    html += `<section class="month-section" id="month-tba">
      <div class="month-header">
        <div class="month-name-badge">Data TBA</div>
        <div class="month-line"></div>
        <div class="month-event-count">${tbas.length} event${tbas.length===1?"":"ów"}</div>
      </div>
      <div class="events-list">
        ${tbas.map(ev => buildCard(ev, EVENTS.indexOf(ev))).join("")}
      </div>
    </section>`;
  }

  if (!html) {
    html = `<div class="empty-state">
      <div class="es-icon">🔍</div>
      <h3>Brak wyników</h3>
      <p>Spróbuj zmienić filtr lub wyszukiwane słowo.</p>
    </div>`;
  }

  main.innerHTML = html;
  main.querySelectorAll(".event-card").forEach(card => {
    card.addEventListener("click", () => openModal(+card.dataset.idx));
    card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openModal(+card.dataset.idx); }});
  });
}

// ── Modal ─────────────────────────────────────────────────────────────────────
function openModal(idx) {
  const ev = EVENTS[idx];
  const tm = TYPE_META[ev.type];
  const countdown = getCountdown(ev);
  const dur = durationDays(ev);
  const ongoing = isOngoing(ev);

  let countdownHTML = "";
  if (ongoing) {
    countdownHTML = `<div class="modal-countdown-full"><div class="mcf-label">Status</div><div class="mcf-value" style="color:var(--green)">▶ TRWA</div><div class="mcf-sub">${formatDateFull(ev)}</div></div>`;
  } else if (countdown !== null) {
    countdownHTML = `<div class="modal-countdown-full"><div class="mcf-label">Do startu</div><div class="mcf-value">${countdown}</div><div class="mcf-sub">dni (${formatDateFull(ev)})</div></div>`;
  }

  let catsHTML = ev.categories.length
    ? `<div class="modal-cats">${ev.categories.map(catPillHTML).join("")}</div>` : "";

  const body = `
    <div class="modal-type-row">
      <div class="modal-color-bar" style="background:${tm.color}"></div>
      <div>
        <div class="modal-title">${ev.name}</div>
        <div class="modal-subtitle"><span class="type-badge ${tm.badgeClass}">${TYPE_ICONS[ev.type]} ${tm.label}</span></div>
      </div>
    </div>
    <div class="modal-divider"></div>
    <div class="modal-grid">
      <div class="modal-info-box">
        <div class="mib-label">📅 Data</div>
        <div class="mib-value">${formatDateFull(ev)}</div>
      </div>
      <div class="modal-info-box">
        <div class="mib-label">⏱ Czas trwania</div>
        <div class="mib-value">${!ev.start ? "TBA" : dur > 1 ? dur + " dni" : "1 dzień"}</div>
      </div>
      <div class="modal-info-box" style="grid-column:1/-1">
        <div class="mib-label">📍 Miejsce</div>
        <div class="mib-value">${ev.location || "—"}</div>
      </div>
    </div>
    ${catsHTML}
    ${countdownHTML}
    ${ev.notes ? `<div class="modal-notes">📝 ${ev.notes}</div>` : ""}
  `;

  document.getElementById("modal-body").innerHTML = body;
  document.getElementById("modal").classList.add("open");
  document.body.style.overflow = "hidden";
}

function closeModal() {
  document.getElementById("modal").classList.remove("open");
  document.body.style.overflow = "";
}

// ── Event listeners ───────────────────────────────────────────────────────────
document.getElementById("modal-close").addEventListener("click", closeModal);
document.getElementById("modal").addEventListener("click", e => {
  if (e.target === document.getElementById("modal")) closeModal();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

// Sidebar filters
document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.filter;
    // Sync bottom nav
    document.querySelectorAll(".bnav-btn[data-filter]").forEach(b => {
      b.classList.toggle("active", b.dataset.filter === activeFilter);
    });
    render();
  });
});

// Bottom nav
document.querySelectorAll(".bnav-btn[data-filter]").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".bnav-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.filter;
    // Sync sidebar
    document.querySelectorAll(".filter-btn").forEach(b => {
      b.classList.toggle("active", b.dataset.filter === activeFilter);
    });
    render();
  });
});

// Search
const searchInput = document.getElementById("search-input");
const searchWrapper = document.getElementById("search-wrapper");
const searchClear = document.getElementById("search-clear");

searchInput.addEventListener("input", () => {
  searchQuery = searchInput.value.trim();
  searchWrapper.classList.toggle("has-value", !!searchQuery);
  render();
});
searchClear.addEventListener("click", () => {
  searchInput.value = ""; searchQuery = "";
  searchWrapper.classList.remove("has-value");
  searchInput.focus(); render();
});

// Mobile search button
document.getElementById("bnav-search-btn").addEventListener("click", () => {
  searchInput.focus();
  searchInput.scrollIntoView({ behavior: "smooth" });
});

// Today button — scroll to nearest upcoming/ongoing month
document.getElementById("today-btn").addEventListener("click", () => {
  const now = new Date(); now.setHours(0,0,0,0);
  const mi = now.getMonth();
  // Try current month, then next months
  for (let delta = 0; delta < 12; delta++) {
    const mIdx = (mi + delta) % 12;
    const el = document.getElementById("month-" + mIdx);
    if (el) { el.scrollIntoView({ behavior: "smooth" }); break; }
  }
});

// Init
renderMonthNav();
render();
</script>
</body>
</html>
